# Behavior of the simulated S7-1500 CPU 1517 and 1518: the shipped simulation
# with the limits of this CPU class. The session count and the intervals follow
# the system limits of firmware V3.1.x, the alarm queue sizes the table of the
# server presentation (docs/references.md).
#
# Start with: make run MODEL_SIMULATION=<absolute path of this file>

include simulation.conf

limit max-sessions 64
limit publishing-interval-min 10
limit sampling-interval-min 10

value ns=3;s=SimaticAlarmsAndConditions.ProgramAlarms.MaxAlarmsInQueue 400
value ns=3;s=SimaticAlarmsAndConditions.SystemDiagnostics.MaxAlarmsInQueue 200
