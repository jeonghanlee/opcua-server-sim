# Behavior of the simulated S7-1500 CPU.
#
#   cycle <milliseconds>
#       Interval between simulation steps.
#
#   include <file>
#       Reads another simulation file first. A name that is not absolute is
#       relative to the directory of the file that holds the line. A CPU class
#       profile is such a file: it includes this one and then sets its limits.
#
#   limit <name> <number>
#       Limit of the running server, replacing the value of the configuration
#       file, or a count that the Server object reports.
#       name    max-sessions                     number of sessions, 1 to 65535
#               publishing-interval-min          milliseconds, 5 up to the configured maximum
#               sampling-interval-min            milliseconds, 5 up to the configured maximum
#               max-browse-continuation-points   reported count, 0 to 65535
#               max-query-continuation-points    reported count, 0 to 65535
#               max-history-continuation-points  reported count, 0 to 65535
#       The configured maximum of an interval is the maximum of the same interval
#       limit in the configuration file; a value above it is an error of the line.
#
#   value <node-id> <number>
#       Sets a Variable to a number when the file is read. The number is the
#       start value of the Variable: a restart returns to it.
#
#   signal <node-id> <kind> [min=<n>] [max=<n>] [step=<n>] [period=<ms>]
#       kind    random  new value in [min, max] every period
#               ramp    adds step every period, restarts at min after max
#               toggle  alternates between min and max every period
#               sine    swings between min and max once per period
#       Defaults: min=0 max=100 step=1 period=1000
#
#   pack <target-node-id> <bit-node-id> ...
#       Collects Boolean Variables into the bits of an integer Variable, the
#       first one in bit 0.
#
#   count <target-node-id> <bit-node-id> ...
#       Writes the number of true Boolean Variables into the target.
#
#   on-delay <input-node-id> <output-node-id> delay=<ms|node-id> [elapsed=<node-id>]
#       Sets the output after the input has been true for the delay, clears
#       it when the input is false. The delay is a number of milliseconds or
#       a Variable that holds it; the elapsed time goes to the Variable named
#       by elapsed.
#
#   alarm <type-node-id> <source-node-id> <trigger-node-id> <severity> <message>
#       Alarm with a state. It becomes active when the Boolean trigger becomes
#       true and inactive when the trigger becomes false, and reports each
#       change as an event of the given condition type from the source Object.
#       Clients acknowledge it with the Acknowledge method.
#
#   event <type-node-id> <source-node-id> <trigger-node-id> <severity> <message>
#       Alarm without a state: one event each time the trigger becomes true.
#       The severity is 1 to 1000; the message runs to the end of the line.
#
#   field <trigger-node-id> <browse-name> <value>
#       Sets an event field of the alarm or event that the trigger names; the
#       line follows the alarm or event line. The value runs to the end of the
#       line. InfoText and AdditionalText_01 to AdditionalText_09 are texts, ID
#       and DisplayClass numbers up to 65535, GroupID a number up to 255.
#       AssociatedValue_01 to AssociatedValue_10 are associated values of the
#       union SimaticAssociatedAlarmValue: the value is "<member> <value>",
#       where the member is Invalid, Boolean, Int16, Int32, Int64, SByte,
#       Byte, UInt16, UInt32, UInt64, Float, Double, or String. The value is
#       a whole number that fits the member, a floating point number, true or
#       false (or 1 or 0), or the rest of the line for a String. The switch
#       field of the union is the position of the member counted from 1
#       (Boolean 2, Int16 3, String 13).
#
#   queue <max-node> <hysteresis-node> <current-node> <outstanding-node> <source-node> <overload-trigger-node>
#       Alarm queue. The alarms with a state whose source Object is the source
#       node belong to it. At most the value of the max node of them are
#       active; the others are outstanding and become active, oldest first,
#       when room frees. The current node holds the number of active alarms,
#       the outstanding node the number of outstanding ones. The Boolean
#       overload trigger becomes true when the active alarms reach the maximum
#       and false when no alarm is outstanding and their number is below the
#       maximum minus the value of the hysteresis node; an alarm line on it
#       reports the overload alarm.
#
#   method <node-id> <kind> [busy=<ms>] [in=<node-id>] [out=<node-id>]
#       kind    echo    returns the input arguments as output arguments
#               accept  returns no values
#               sum     returns the sum of the input arguments
#               sort    returns each input array in ascending order
#       busy    time after an accepted call during which further calls fail
#       in, out structure Variables of the method instance that receive the
#               input and the output arguments of the last call; an argument
#               goes to the member with the same name
#
#   operating-mode <node-id> run=<n> stop=<n>
#       Variable that shows the operating state, and its values in RUN and in
#       STOP. Adds the Boolean Variable "Simulator.Run" in the namespace
#       urn:opcua-server-sim:control; writing false puts the CPU in STOP,
#       writing true restarts it. In STOP the signals and logic elements
#       hold, clients still read and write, and methods return
#       BadInvalidState. A restart sets every Variable to its start value.
#
#   user <name> <password>
#   anonymous <yes|no>
#       User accounts, and whether a client may connect without one.

# The clock memory needs a step every 50 ms for its 10 Hz bit.
cycle 50

# Operating state of the CPU: Run is 8 and Stop is 4 in SimaticOperatingState.
operating-mode ns=3;s=OperatingMode run=8 stop=4

# Continuation point counts that the Server object reports. The server keeps
# its own limit; the reported number follows the documented CPU value.
limit max-browse-continuation-points 5
limit max-query-continuation-points 5
limit max-history-continuation-points 5

# Guest access and one user account, as the Siemens client example enables
# them. The account is the simulator's own.
anonymous yes
user simulator composite

# Data block "DataSimulation": the program fills every tag with pseudo-random
# values in each cycle.
signal ns=3;s="DataSimulation"."myBool"    random  min=0 max=1 period=1000
signal ns=3;s="DataSimulation"."myByte"    random  min=0 max=255 period=1000
signal ns=3;s="DataSimulation"."myWord"    random  min=0 max=65535 period=1000
signal ns=3;s="DataSimulation"."myDword"   random  min=0 max=4294967295 period=1000
signal ns=3;s="DataSimulation"."myInt"     random  min=-32768 max=32767 period=1000
signal ns=3;s="DataSimulation"."myUInt"    random  min=0 max=65535 period=1000
signal ns=3;s="DataSimulation"."myReal"    random  min=-1000 max=1000 period=1000
signal ns=3;s="DataSimulation"."myArray"   random  min=0 max=255 period=1000

# Clock memory: each bit changes state twice per period of its frequency, so
# the toggle period is half of that period. The clock memory byte holds the
# bits in the order of the CPU: bit 0 is 10 Hz, bit 7 is 0.5 Hz.
signal ns=3;s="Clock_10Hz"     toggle  min=0 max=1 period=50
signal ns=3;s="Clock_5Hz"      toggle  min=0 max=1 period=100
signal ns=3;s="Clock_2.5Hz"    toggle  min=0 max=1 period=200
signal ns=3;s="Clock_2Hz"      toggle  min=0 max=1 period=250
signal ns=3;s="Clock_1.25Hz"   toggle  min=0 max=1 period=400
signal ns=3;s="Clock_1Hz"      toggle  min=0 max=1 period=500
signal ns=3;s="Clock_0.625Hz"  toggle  min=0 max=1 period=800
signal ns=3;s="Clock_0.5Hz"    toggle  min=0 max=1 period=1000
pack ns=3;s="Clock_Byte" ns=3;s="Clock_10Hz" ns=3;s="Clock_5Hz" ns=3;s="Clock_2.5Hz" ns=3;s="Clock_2Hz" ns=3;s="Clock_1.25Hz" ns=3;s="Clock_1Hz" ns=3;s="Clock_0.625Hz" ns=3;s="Clock_0.5Hz"

# Memory tags of the timer example: the timer expires after its start input
# has been set for the delay.
on-delay ns=3;s="StartTimer" ns=3;s="TimerExpired" delay=5000

# IEC timer data block: an on-delay timer with its preset time PT, elapsed
# time ET, input IN, and output Q.
on-delay ns=3;s="IEC_Timer_0_DB".IN ns=3;s="IEC_Timer_0_DB".Q delay=ns=3;s="IEC_Timer_0_DB".PT elapsed=ns=3;s="IEC_Timer_0_DB".ET

# Program alarms, reported by the UserProgram object. A CPU maps the alarm
# priorities 0 to 16 to the severities 1 to 1000: priority 10 is 600,
# priority 4 is 300, priority 12 is 720.
event ns=3;i=1804 ns=3;s=SimaticAlarmsAndConditions.ProgramAlarms.UserProgram ns=3;s="AlarmTriggers"."Program_Alarm"   300 myText
alarm ns=3;i=1805 ns=3;s=SimaticAlarmsAndConditions.ProgramAlarms.UserProgram ns=3;s="AlarmTriggers"."Program_Alarm_1" 600 Program alarm that requires acknowledgment
alarm ns=3;i=1805 ns=3;s=SimaticAlarmsAndConditions.ProgramAlarms.UserProgram ns=3;s="AlarmTriggers"."Program_Alarm_2" 720 Program alarm with a state
alarm ns=3;i=1805 ns=3;s=SimaticAlarmsAndConditions.ProgramAlarms.UserProgram ns=3;s="AlarmTriggers"."Program_Alarm_3" 600 Third program alarm with a state
alarm ns=3;i=1805 ns=3;s=SimaticAlarmsAndConditions.SystemDiagnostics ns=3;s="AlarmTriggers"."System_Alarm" 500 System diagnostics alarm

# Event fields of the alarms: InfoText and AdditionalText_01 to
# AdditionalText_09 are texts, ID and DisplayClass are numbers up to 65535,
# GroupID is a number up to 255, and AssociatedValue_01 to AssociatedValue_10
# take "<member> <value>". A field line follows the alarm or event line of its
# trigger.
field ns=3;s="AlarmTriggers"."Program_Alarm" InfoText Information text of the program alarm
field ns=3;s="AlarmTriggers"."Program_Alarm" AdditionalText_01 First additional text of the program alarm
field ns=3;s="AlarmTriggers"."Program_Alarm_2" InfoText Information text of the alarm with a state
field ns=3;s="AlarmTriggers"."Program_Alarm_2" AdditionalText_01 First additional text of the alarm with a state
field ns=3;s="AlarmTriggers"."Program_Alarm_2" ID 2
field ns=3;s="AlarmTriggers"."Program_Alarm_2" DisplayClass 1
field ns=3;s="AlarmTriggers"."Program_Alarm_2" GroupID 4

# Production line example.
signal ns=3;s="Data_for_OPC_UA_Clients"."NewProduct"     toggle  min=0 max=1 period=5000
signal ns=3;s="Data_for_OPC_UA_Clients"."ProductNumber"  ramp    min=1 max=32767 step=1 period=10000
signal ns=3;s="Data_for_OPC_UA_Clients"."Temperature"    random  min=20 max=80 period=1000

# Queues of the alarms with a state. The alarms of the source UserProgram
# belong to the program queue and those of SystemDiagnostics to the system
# diagnostics queue. A queue lets at most MaxAlarmsInQueue alarms be active;
# the others wait as outstanding alarms. The overload alarm is active from the
# moment the active alarms reach the maximum until no alarm is outstanding and
# their number is below the maximum minus OverloadHysteresis.
queue ns=3;s=SimaticAlarmsAndConditions.ProgramAlarms.MaxAlarmsInQueue ns=3;s=SimaticAlarmsAndConditions.Overloads.OverloadHysteresis ns=3;s=SimaticAlarmsAndConditions.ProgramAlarms.CurrentAlarmsInQueue ns=3;s=SimaticAlarmsAndConditions.Overloads.OutstandingProgramAlarms ns=3;s=SimaticAlarmsAndConditions.ProgramAlarms.UserProgram ns=3;s="AlarmTriggers"."Overload_Program"
queue ns=3;s=SimaticAlarmsAndConditions.SystemDiagnostics.MaxAlarmsInQueue ns=3;s=SimaticAlarmsAndConditions.Overloads.OverloadHysteresis ns=3;s=SimaticAlarmsAndConditions.SystemDiagnostics.CurrentAlarmsInQueue ns=3;s=SimaticAlarmsAndConditions.Overloads.OutstandingSystemDiagnostics ns=3;s=SimaticAlarmsAndConditions.SystemDiagnostics ns=3;s="AlarmTriggers"."Overload_System"
alarm ns=3;i=1805 ns=3;s=SimaticAlarmsAndConditions.ProgramAlarms ns=3;s="AlarmTriggers"."Overload_Program" 900 Overload of the program alarms
alarm ns=3;i=1805 ns=3;s=SimaticAlarmsAndConditions ns=3;s="AlarmTriggers"."Overload_System" 900 Overload of the system diagnostics alarms

# Server methods. The parameters of the last call stay in the static data of
# the method instance.
method ns=3;s="InstUaMethodAdding".Method sum in=ns=3;s="InstUaMethodAdding"."UAMethod_InParameters" out=ns=3;s="InstUaMethodAdding"."UAMethod_OutParameters"
method ns=3;s="InstMethodEcho".Method echo in=ns=3;s="InstMethodEcho"."UAMethod_InParameters" out=ns=3;s="InstMethodEcho"."UAMethod_OutParameters"
method ns=3;s="InstMethodSort".Method sort in=ns=3;s="InstMethodSort"."UAMethod_InParameters" out=ns=3;s="InstMethodSort"."UAMethod_OutParameters"
method ns=3;s="InstMethodStoreTime".Method accept in=ns=3;s="InstMethodStoreTime"."UAMethod_InParameters"
method ns=3;s="InstMethodSequence".Method accept busy=3000
method ns=3;s="OpenDoor_DB".Method echo in=ns=3;s="OpenDoor_DB"."UAMethod_InParameters" out=ns=3;s="OpenDoor_DB"."UAMethod_OutParameters"
